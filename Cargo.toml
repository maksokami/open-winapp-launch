[package]
name = "app-launcher"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "A per-user Windows tray application launcher"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
slint = { version = "1.13", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06"] }

[target.'cfg(windows)'.dependencies]
global-hotkey = "0.7"
raw-window-handle = "0.6"
tray-icon = "0.21"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[build-dependencies]
slint-build = "1.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
